<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Super Projeto - Basico</title>
</h:head>
<h:body>
    <h2>Cadastro de Clientes</h2>
    <h:form id="formCliente">
        <h:messages style="color: red;" />
        
        <h:panelGrid columns="2">
            <h:outputLabel for="nome" value="Nome:" />
            <h:inputText id="nome" value="#{clienteController.cliente.nome}" required="true" requiredMessage="Nome é obrigatório!" />

            <h:outputLabel for="cpf" value="CPF:" />
            <h:inputText id="cpf" value="#{clienteController.cliente.cpf}" required="true" requiredMessage="CPF é obrigatório!" />

            <h:outputLabel for="email" value="Email:" />
            <h:inputText id="email" value="#{clienteController.cliente.email}" />
        </h:panelGrid>

        <br/>
        <h:commandButton value="Salvar Cliente" action="#{clienteController.salvar}" />
    </h:form>

    <hr />

    <!-- Tabela nativa do HTML/JSF -->
    <h:dataTable value="#{clienteController.listaClientes}" var="cli" border="1">
        <h:column>
            <f:facet name="header">ID</f:facet>
            <h:outputText value="#{cli.id}" />
        </h:column>
        <h:column>
            <f:facet name="header">Nome</f:facet>
            <h:outputText value="#{cli.nome}" />
        </h:column>
        <h:column>
            <f:facet name="header">CPF</f:facet>
            <h:outputText value="#{cli.cpf}" />
        </h:column>
        <h:column>
            <f:facet name="header">Email</f:facet>
            <h:outputText value="#{cli.email}" />
        </h:column>
    </h:dataTable>
</h:body>
</html>
